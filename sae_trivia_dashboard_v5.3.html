<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAE Trivia League — Dashboard</title>
<!-- v5.1 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #1a0633;
  --card: #2d0a54;
  --card2: #3d126e;
  --accent: #ffcc00;
  --text: #ffffff;
  --muted: rgba(255,255,255,0.58);
  --faint: rgba(255,255,255,0.18);
  --border: rgba(255,204,0,0.25);
  --line: rgba(255,204,0,0.08);
  --win: #00c853;
  --lose: #ff4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, sans-serif; min-height: 100vh; padding: 0 0 60px; }
button { font-family: inherit; }

.topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
.topbar-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.topbar h1 { color: var(--accent); font-size: 1.2rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
.season-chip { background: var(--card2); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; font-size: 0.78rem; font-weight: 700; }
.season-chip .live { color: var(--win); }
.season-chip .arch { color: var(--muted); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.week-badge { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 0.78rem; color: var(--accent); font-weight: 700; }
.btn { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; color: var(--accent); font-size: 0.78rem; font-weight: 700; padding: 7px 14px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.btn:hover { background: var(--accent); color: var(--bg); }
.btn.ghost { background: transparent; color: var(--muted); border-color: var(--faint); }
.btn.ghost:hover { color: var(--text); border-color: var(--text); background: transparent; }
.btn.danger { background: transparent; color: rgba(255,68,68,0.85); border-color: rgba(255,68,68,0.4); }
.btn.danger:hover { background: rgba(255,68,68,0.15); color: var(--lose); }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }

.main { max-width: 1280px; margin: 0 auto; padding: 28px 24px; }

.tabs { display: flex; gap: 4px; margin-bottom: 28px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tab { background: none; border: none; color: var(--muted); font-size: 0.9rem; font-weight: 600; padding: 10px 18px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.section-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.note { font-size: 0.8rem; color: var(--muted); background: rgba(255,204,0,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; line-height: 1.5; }
.note strong { color: var(--text); }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.tbl th { text-align: left; padding: 10px 12px; font-size: 0.68rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl th.r, .tbl td.r { text-align: right; }
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover { color: var(--text); }
.tbl th.sorted { color: var(--accent); }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr:hover td { background: rgba(255,204,0,0.04); }
.tbl td.wk { font-size: 0.8rem; color: var(--muted); text-align: right; padding: 11px 6px; }
.tbl th.wk { text-align: right; padding: 10px 6px; }
.tbl td.wk.best { color: var(--accent); font-weight: 700; }
.tbl td.wk.blank { color: var(--faint); }
.rank-num { font-weight: 800; font-size: 1rem; color: var(--muted); width: 32px; display: inline-block; text-align: center; }
.rank-num.gold { color: #FFD700; } .rank-num.silver { color: #C0C0C0; } .rank-num.bronze { color: #CD7F32; }
.team-name-cell { font-weight: 700; font-size: 0.95rem; }
.sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; font-weight: 400; }
.num { font-weight: 700; text-align: right; }
.accent { color: var(--accent); }
.badge { display: inline-block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px; padding: 2px 7px; border-radius: 4px; }
.badge-W { background: rgba(0,200,83,0.15); color: var(--win); border: 1px solid rgba(0,200,83,0.3); }
.badge-L { background: rgba(255,68,68,0.15); color: var(--lose); border: 1px solid rgba(255,68,68,0.3); }
.badge-T { background: rgba(255,255,255,0.08); color: var(--muted); border: 1px solid var(--faint); }
.seed-line td { border-bottom: 2px dashed rgba(255,204,0,0.35); }

/* Stat strip */
.stats-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.stat-label { font-size: 0.68rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.stat-val { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
.stat-sub { font-size: 0.75rem; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Week tabs */
.week-tabs-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
.week-tab-btn { background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 0.8rem; font-weight: 700; padding: 7px 14px; cursor: pointer; transition: all 0.15s; position: relative; }
.week-tab-btn small { display: block; font-size: 0.65rem; font-weight: 400; opacity: 0.75; }
.week-tab-btn:hover { border-color: var(--accent); color: var(--accent); }
.week-tab-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.week-tab-btn.bye { opacity: 0.6; border-style: dashed; }
.week-tab-btn.po { border-color: rgba(255,204,0,0.55); }
.week-tab-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--win); position: absolute; top: -3px; right: -3px; }

.upload-area { border: 1px dashed var(--border); border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; background: rgba(255,204,0,0.03); flex-wrap: wrap; }
.upload-info { font-size: 0.85rem; color: var(--muted); }
.upload-info strong { color: var(--text); display: block; margin-bottom: 2px; font-size: 0.92rem; }
.upload-btn { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; color: var(--accent); font-size: 0.78rem; font-weight: 700; padding: 8px 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; transition: all 0.15s; }
.upload-btn:hover { background: var(--accent); color: var(--bg); }

.matches-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-bottom: 24px; }
.match-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.match-card.pending { border-style: dashed; opacity: 0.85; }
.match-card-header { background: var(--card2); padding: 8px 14px; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
.link { background: none; border: none; color: var(--muted); font-size: 0.7rem; text-decoration: underline; cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 600; }
.link:hover { color: var(--lose); }
.match-scoreline { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); gap: 12px; }
.match-team-name { font-weight: 800; font-size: 0.95rem; flex: 1; min-width: 0; }
.match-team-name.winner { color: var(--accent); }
.match-team-name.right { text-align: right; }
.match-big-score { font-size: 1.7rem; font-weight: 900; white-space: nowrap; }
.match-sep { color: var(--muted); font-size: 1rem; font-weight: 400; padding: 0 4px; }
.match-cols { display: grid; grid-template-columns: 1fr 1fr; }
.match-players { padding: 10px 14px; }
.match-cols .match-players:first-child { border-right: 1px solid var(--line); }
.match-player-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.82rem; gap: 8px; }
.match-player-score { font-weight: 700; color: var(--muted); }
.match-player-score.top { color: var(--accent); }
.vs-line { padding: 18px 16px; text-align: center; font-weight: 700; font-size: 0.92rem; }
.vs-line .vs { color: var(--muted); font-weight: 400; padding: 0 6px; }
.vs-line .wait { display: block; font-size: 0.75rem; color: var(--muted); font-weight: 400; margin-top: 6px; }

.award-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
.award-card { border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; }
.award-card.mvp { background: linear-gradient(135deg, #1a0633 0%, #2d1a00 100%); border: 1.5px solid var(--accent); }
.award-card.aow { background: linear-gradient(135deg, #1a0633 0%, #1a0000 100%); border: 1.5px solid var(--lose); }
.award-icon { font-size: 2.4rem; line-height: 1; }
.award-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
.award-card.mvp .award-label { color: var(--accent); }
.award-card.aow .award-label { color: var(--lose); }
.award-name { font-size: 1.2rem; font-weight: 800; }
.award-score { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

.bye-card { background: var(--card); border: 1px dashed var(--border); border-radius: 12px; padding: 40px 24px; text-align: center; }
.bye-card .big { font-size: 2.2rem; margin-bottom: 10px; }
.bye-card h3 { font-size: 1rem; color: var(--accent); margin-bottom: 6px; }
.bye-card p { font-size: 0.85rem; color: var(--muted); }

/* Segmented control */
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; margin-bottom: 18px; flex-wrap: wrap; }
.seg button { background: none; border: none; color: var(--muted); font-size: 0.82rem; font-weight: 700; padding: 7px 16px; border-radius: 7px; cursor: pointer; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--accent); color: var(--bg); }
.view-desc { font-size: 0.8rem; color: var(--muted); margin: -6px 0 16px; }

/* Teams */
.teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.team-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.team-card-head { background: var(--card2); padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.team-card-head .nm { font-weight: 800; color: var(--accent); font-size: 1rem; }
.team-card-head .formerly { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
.team-card-body { padding: 10px 14px; }
.team-card-foot { padding: 8px 14px 12px; font-size: 0.78rem; color: var(--muted); }
.cap { color: var(--accent); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.5px; margin-left: 4px; }

/* Charts */
.chart-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.chart-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }

/* Bracket */
.champion-banner { margin: 20px 0; text-align: center; background: linear-gradient(135deg, #1a0633 0%, #2d1a00 100%); border: 1.5px solid var(--accent); border-radius: 14px; padding: 22px; font-size: 1.2rem; font-weight: 800; color: var(--accent); }
.bracket-wrap { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 28px; }
.bracket-col { flex: 0 0 230px; display: flex; flex-direction: column; }
.bracket-col-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); text-align: center; margin-bottom: 4px; }
.bracket-col-date { font-size: 0.68rem; color: var(--muted); text-align: center; margin-bottom: 12px; }
.bracket-col-body { display: flex; flex-direction: column; justify-content: space-around; gap: 18px; flex: 1; }
.bracket-slot { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; }
.bracket-slot.pending { opacity: 0.6; border-style: dashed; }
.bracket-team { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; gap: 8px; }
.bracket-team.winner { color: var(--accent); font-weight: 800; }
.seed { color: var(--muted); font-size: 0.7rem; margin-right: 4px; font-weight: 400; }
.seed-wrap { max-width: 620px; margin-bottom: 32px; }

/* Season picker */
.seasons-head { max-width: 1000px; margin: 0 auto; padding: 40px 24px 10px; }
.seasons-head h2 { font-size: 1.6rem; font-weight: 900; margin: 18px 0 6px; }
.seasons-head p { color: var(--muted); font-size: 0.9rem; }
.seasons-grid { max-width: 1000px; margin: 0 auto; padding: 20px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.season-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; cursor: pointer; text-align: left; color: var(--text); transition: all 0.15s; display: flex; flex-direction: column; gap: 10px; }
.season-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.season-card .lbl { font-size: 1.3rem; font-weight: 900; color: var(--accent); }
.season-card .status { font-size: 0.68rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.season-card .row { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); gap: 10px; }
.season-card .row b { color: var(--text); font-weight: 700; text-align: right; }
.season-card.empty { cursor: default; opacity: 0.5; border-style: dashed; }
.season-card.empty:hover { transform: none; border-color: var(--border); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state .big-icon { font-size: 2.5rem; margin-bottom: 14px; opacity: 0.5; }
.empty-state h3 { font-size: 1rem; font-weight: 700; margin-bottom: 6px; color: var(--text); }
.empty-state p { font-size: 0.84rem; line-height: 1.6; max-width: 380px; margin: 0 auto; }

.data-bar { max-width: 1280px; margin: 10px auto 0; padding: 18px 24px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
.data-bar .grow { flex: 1; min-width: 200px; }


/* The Rafters */
.rafter-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 18px; overflow: hidden; }
.rafter-head { background: var(--card2); padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.rafter-head .nm { font-weight: 800; color: var(--accent); }
.rafter-btns { display: flex; gap: 8px; }
.discord { background: #313338; margin: 16px; border-radius: 8px; padding: 14px 16px; font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #dbdee1; font-size: 0.95rem; line-height: 1.45; }
.discord-name { color: #f2f3f5; font-weight: 600; margin-bottom: 4px; }
.discord-body b { color: #f2f3f5; }
.rafter-ta { display: block; width: calc(100% - 32px); margin: 0 16px 16px; min-height: 260px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: ui-monospace, Menlo, monospace; font-size: 0.82rem; line-height: 1.5; resize: vertical; }
.rafter-notes { padding: 0 16px 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.74rem; color: var(--muted); }
.rafter-notes b { color: var(--text); font-weight: 600; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(10,0,25,0.75); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal-bg.show { display: flex; }
.modal { background: var(--card); border: 1px solid var(--accent); border-radius: 14px; padding: 22px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
.modal h3 { color: var(--accent); font-size: 1.05rem; margin-bottom: 8px; }
.modal p { font-size: 0.84rem; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
.modal label.fl { display: block; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
.modal input[type=text], .modal select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 0.95rem; font-family: inherit; }
.modal input[type=text]:focus, .modal select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.blockbox { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 0.82rem; }
.blockbox .raw { font-weight: 800; }
.blockbox .pl { color: var(--muted); margin-top: 3px; }

.toast { position: fixed; bottom: 24px; right: 24px; background: var(--card2); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 18px; font-size: 0.85rem; font-weight: 600; z-index: 200; transform: translateY(80px); opacity: 0; transition: all 0.3s; max-width: 340px; pointer-events: none; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.warn { border-color: var(--lose); }

@media (max-width: 768px) {
  .stats-strip { grid-template-columns: 1fr 1fr; }
  .award-cards { grid-template-columns: 1fr; }
  .topbar { padding: 12px 16px; }
  .topbar h1 { font-size: 1rem; }
  .main { padding: 18px 16px; }
  .matches-row { grid-template-columns: 1fr; }
  .tab { padding: 10px 12px; font-size: 0.84rem; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="restore-input" accept=".json" style="display:none">
<script>
/* =====================================================================
   SAE TRIVIA LEAGUE DASHBOARD — v5
   ---------------------------------------------------------------------
   HOW TEAM NAMES WORK
   • Every team has a permanent id (e.g. "ragio") that never changes.
     Schedules, standings and the bracket all point at the id, so a
     name change can never break anything.
   • To rename a team mid-season: Teams tab → "Rename". That's it.
     Every tab updates instantly, and CSVs that still use any old name
     keep loading (old names are remembered as aliases).
   • Teams are recognised in a CSV by their PLAYERS first, then by name,
     so a jokey team name in a CSV doesn't matter.
   • To set a name permanently in this file instead, edit `name:` below.
   ===================================================================== */

// ---------- SEASON 3 TEAMS (captain listed first) ----------
const S3_TEAMS = [
  { id: "ragio",     name: "Team Ragio",          captain: "Mike Ragio",     players: ["Mike Ragio", "Bennett Anderson", "Nolan Malone"] },
  { id: "swain",     name: "Team Swain",          captain: "Will Swain",     players: ["Will Swain", "Chris Kulick", "Joey Nieman"] },
  { id: "mikolich",  name: "Team Mikolich",       captain: "Sam Mikolich",   players: ["Sam Mikolich", "Chris Guest", "Charlie Bullock"] },
  { id: "meyer",     name: "Goyim With Attitude", captain: "Sullivan Meyer", players: ["Sullivan Meyer", "Ryan Savoia", "Patrick Luckhaupt"], aliases: ["Team Meyer"] },
  { id: "murtaugh",  name: "Team Murtaugh",       captain: "Nate Murtaugh",  players: ["Nate Murtaugh", "Eric Bachman", "Sam Bosworth"] },
  { id: "clark",     name: "Judge and Jury",      captain: "Nick Clark",     players: ["Nick Clark", "Garrett Rotz", "Sean Quinn"], aliases: ["Team Clark"] },
  { id: "acocella",  name: "Team Acocella",       captain: "Jamie Acocella", players: ["Jamie Acocella", "Jack Owen", "Andrew Williams"] },
  { id: "berkowitz", name: "Team Berkowitz",      captain: "Josh Berkowitz", players: ["Josh Berkowitz", "Tyler Shapiro", "Andrew Urquiola"] },
  { id: "obeto",     name: "Team Obeto",          captain: "John Obeto",     players: ["John Obeto", "Jack Neiland", "Justin Zuralow"] },
];

// ---------- SEASON 3 SCHEDULE ----------
// Single round robin: 9 game weeks, every team plays the other 8 once and
// hosts once (the host team has that week off). Sundays.
const S3_SCHEDULE = [

    (p.bySeason[r.season] = p.bySeason[r.season] || []).push(r.score);
    p.last = r;
  }
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return Object.values(P).map(p => ({
    ...p,
    gp: p.scores.length, total: p.scores.reduce((x, y) => x + y, 0), ppg: avg(p.scores),
    regPpg: avg(p.reg), poPpg: avg(p.po), regGp: p.reg.length, poGp: p.po.length,
    best: Math.max(...p.scores), seasons: Object.keys(p.bySeason).length,
    seasonPpg: Object.fromEntries(Object.entries(p.bySeason).map(([k, v]) => [k, avg(v)])),
  }));
}

function defaultWeek(m) {

/* ============================== MATCH CARDS ============================== */
function findGame(games, a, b) { return games.find(g => (g.a.id === a && g.b.id === b) || (g.a.id === b && g.b.id === a)); }
function playerList(players) {
  if (!players.length) return '<span class="sub">Team total only</span>';
  const top = Math.max(...players.map(p => p.score));
  return players.map(p => `<div class="match-player-row"><span>${esc(p.name)}</span><span class="match-player-score ${p.score === top ? 'top' : ''}">${fmtScore(p.score)}</span></div>`).join('');
}
function matchCard(m, g, header, order, seedOf) {
  let [x, y] = [g.a, g.b];
  if (order && order[0] && g.b.id === order[0]) [x, y] = [g.b, g.a];
  const sr = sideResult(g, x.id), win = sr > 0 ? 0 : sr < 0 ? 1 : -1;
  if (g.ot) header += ' · OT';
  const sd = id => seedOf && seedOf(id) ? `<span class="seed">(${seedOf(id)})</span>` : '';
  const rm = m.s.editable ? `<button class="link" data-act="remove" data-h="${g.h}" data-phase="${g.phase}" data-key="${g.key}">remove</button>` : '';
  return `<div class="match-card">
    <div class="match-card-header"><span>${esc(header)}</span>${rm}</div>
    <div class="match-scoreline">
      <span class="match-team-name ${win === 0 ? 'winner' : ''}">${sd(x.id)}${esc(m.name(x.id))}</span>
      <span class="match-big-score">${fmtScore(x.total)}<span class="match-sep">–</span>${fmtScore(y.total)}</span>
      <span class="match-team-name right ${win === 1 ? 'winner' : ''}">${esc(m.name(y.id))}${sd(y.id) ? ' ' + sd(y.id) : ''}</span>
    </div>
    <div class="match-cols"><div class="match-players">${playerList(x.players)}</div><div class="match-players">${playerList(y.players)}</div></div>
  </div>`;
}
function pendingCard(m, pair, header, seedOf, waitText) {
  const nm = id => id ? `${seedOf && seedOf(id) ? `<span class="seed">(${seedOf(id)})</span>` : ''}${esc(m.name(id))}` : '<span style="color:var(--muted)">TBD</span>';
  return `<div class="match-card pending"><div class="match-card-header"><span>${esc(header)}</span></div>
    <div class="vs-line">${nm(pair[0])}<span class="vs">vs</span>${nm(pair[1])}<span class="wait">${esc(waitText || 'Awaiting result')}</span></div></div>`;
}

function uploadArea(m, title, sub, attr) {
  if (!m.s.editable) return '';
  const id = 'up-' + attr.replace(/[^a-z0-9]/gi, '');
  return `<div class="upload-area"><div class="upload-info"><strong>${title}</strong>${sub}</div>
    <label class="upload-btn" for="${id}">+ Upload CSVs</label><input type="file" id="${id}" accept=".csv,text/csv" multiple style="display:none" data-up="${attr}"></div>`;
}
function rankingsBlock(players, withAwards) {
  if (!players.length) return '';
  const sorted = [...players].sort((a, b) => b.score - a.score);
  const aw = weekAwards(players);
  const awards = withAwards ? `<div class="award-cards">
      <div class="award-card mvp"><div class="award-icon">👑</div><div><div class="award-label">MVP${aw.mvp.length > 1 ? 's' : ''} of the Week</div><div class="award-name">${aw.mvp.map(esc).join(', ')}</div><div class="award-score">${fmtScore(aw.max)} points</div></div></div>
      <div class="award-card aow"><div class="award-icon">🍑</div><div><div class="award-label">Ass${aw.aow.length > 1 ? 'es' : ''} of the Week</div><div class="award-name">${aw.aow.map(esc).join(', ') || '—'}</div><div class="award-score">${aw.aow.length ? fmtScore(aw.min) + ' points' : ''}</div></div></div>
    </div>` : '';
  const icons = ['🥇', '🥈', '🥉'];
  const rows = sorted.map((p, i) => {
    const mvp = withAwards && p.score === aw.max, aow = withAwards && aw.aow.length && p.score === aw.min;
    const col = mvp ? 'var(--accent)' : aow ? 'var(--lose)' : 'var(--text)';
    return `<tr><td style="text-align:center;width:40px">${icons[i] || `<span style="color:var(--muted)">${i + 1}</span>`}</td>
      <td style="font-weight:${mvp ? 800 : 600};color:${col}">${esc(p.name)}${mvp ? ' 👑' : aow ? ' 🍑' : ''}</td>
      <td class="sub" style="margin:0">${esc(p.teamName)}</td>
      <td class="r" style="font-size:1.05rem;font-weight:800;color:${col}">${fmtScore(p.score)}</td></tr>`;
  }).join('');
  return awards + `<div class="section-title">Individual Performance Rankings</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th style="text-align:center">#</th><th>Player</th><th>Team</th><th class="r">Score</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderWeek(m, i) {
  const w = m.s.schedule[i];
  if (w.bye) return `<div class="bye-card"><div class="big">${(w.note || '🎉').split(' ')[0]}</div><h3>${esc(w.label)} — ${esc(w.date)}</h3><p>${esc((w.note || 'Bye week').split(' ').slice(1).join(' '))}</p></div>`;
  const games = m.reg.filter(g => g.key === i);
  const used = new Set();
  const cards = w.matches.map(([a, b], k) => {
    const g = findGame(games, a, b);
    if (g) { used.add(g); return matchCard(m, g, 'Match ' + (k + 1), [a, b]); }
    return pendingCard(m, [a, b], 'Match ' + (k + 1));
  });
  games.filter(g => !used.has(g)).forEach(g => cards.push(matchCard(m, g, '⚠️ Not on this week\'s schedule')));
  const players = playersIn(games).map(p => ({ ...p, teamName: m.name(p.team) }));
  const hostTxt = w.host ? `🏠 ${esc(m.name(w.host))} hosting (bye)` : w.off ? `💤 ${esc(m.name(w.off))} off` : '';
  const sub = `<span>${games.length}/${w.matches.length} games loaded · ${hostTxt}</span>`;
  return uploadArea(m, `${esc(w.label)} — ${esc(w.date)}`, sub, 'w:' + i)
    + (m.s.editable ? '' : `<div class="note">${esc(w.label)} — ${esc(w.date)}${w.host ? ` · 🏠 ${esc(m.name(w.host))} hosted` : w.off ? ` · 💤 ${esc(m.name(w.off))} had the week off` : ''}</div>`)
    + `<div class="matches-row">${cards.join('')}</div>` + rankingsBlock(players, true);
}
function renderRound(m, b, key) {
  const r = m.s.playoffs.find(x => x.key === key), R = b.rounds[key];
  const cards = R.pairs.map((pair, k) => {
    const g = R.games[k], label = (key === 'championship' ? '🏆 ' : '') + R.labels[k];
    if (g) return matchCard(m, g, label, pair, b.seedOf);
    const known = pair[0] && pair[1];
    return pendingCard(m, pair, label, b.seedOf, !b.final ? 'Projected from current standings' : known ? 'Awaiting result' : 'Waiting on earlier round');
  }).join('');
  const host = b.hosts[key];
  const players = playersIn(m.po[key]).map(p => ({ ...p, teamName: m.name(p.team) }));
  const sub = `<span>${m.po[key].length}/${R.pairs.length} games loaded · upload in any order, games are matched to the bracket by team</span>`;
  return uploadArea(m, `${esc(r.label)} — ${esc(r.date)}`, sub, 'p:' + key)
    + (!b.final ? `<div class="note">Seeding isn't final until the regular season is complete — matchups below are projections.</div>` : '')
    + `<div class="matches-row">${cards}</div>`
    + (m.s.format === 'simple' ? '' : `<div class="note">🏠 Host: <strong>${host ? esc(m.name(host)) : 'TBD'}</strong> (${HOST_RULE[key]})${key === 'playin' ? ' — seeds 2–7 also have the week off.' : ''}</div>`)
    + ((key === 'championship' || m.s.format === 'simple') && b.champion ? `<div class="champion-banner">🏆 ${esc(m.name(b.champion))} — ${esc(m.s.label)} Champions!</div>` : '')
    + rankingsBlock(players, false);
}

/* ============================== PLAYER STATS ============================== */
const VIEWS = [
  ['reg', 'Regular Season', 'This season, regular-season games only.'],
  ['po', 'Playoffs', 'This season, playoff games only.'],
  ['full', 'Full Season', 'This season, regular season + playoffs combined.'],
  ['career', 'Career', 'Every season on record, regular season + playoffs.'],
];
function titlesByPlayer() {
  const t = {};
  for (const s of SEASONS) {
    const m = model(s), c = bracket(m).champion;
    if (!c) continue;
    const champPlayers = new Set(m.byId[c].players.map(norm));
    (m.po.championship || []).forEach(g => [g.a, g.b].filter(x => x.id === c).forEach(x => x.players.forEach(p => champPlayers.add(norm(p.name)))));
    champPlayers.forEach(k => (t[k] = t[k] || []).push(s.label));
  }
  for (const r of EXTRA_RINGS) r.players.forEach(n => { const k = norm(n); (t[k] = t[k] || []); if (!t[k].includes(r.season)) t[k].push(r.season); });
  return t;
}
function renderPlayers(m) {
  const s = m.s, v = ui.statView;
  const scoped = v === 'career' ? SEASONS.flatMap(performances) : performances(s).filter(r => v === 'full' || r.phase === v);
  let rows = aggregate(scoped);
  const hidden = rows.filter(r => r.gp < ui.minGp).length;
  rows = rows.filter(r => r.gp >= ui.minGp);
  const tally = {};
  for (const ss of (v === 'career' ? SEASONS : [s])) for (const [k, c] of Object.entries(awardTally(ss))) { tally[k] = tally[k] || { mvp: 0, aow: 0 }; tally[k].mvp += c.mvp; tally[k].aow += c.aow; }
  const titles = titlesByPlayer();
  const current = SEASONS[0], curModel = model(current);
  rows.forEach(r => {
    r.mvp = (tally[r.key] || {}).mvp || 0; r.aow = (tally[r.key] || {}).aow || 0;
    r.ringSeasons = (titles[r.key] || []).slice().sort(); r.titles = r.ringSeasons.length;
    if (v === 'career') {
      const t = curModel.teams.find(t => t.playerSet.has(r.key));
      r.team = t ? t.name : model(seasonById(r.last.season)).name(r.last.team);
    } else r.team = m.name(r.last.team);
  });

  const C = [];
  const col = (key, label, get, f, cls) => C.push({ key, label, get, f: f || (x => x ?? '—'), cls: cls || 'r' });
  if (v === 'career') col('seasons', 'Seasons', r => r.seasons);
  col('gp', 'GP', r => r.gp);
  col('ppg', 'PPG', r => r.ppg, x => `<b class="accent">${fmt(x)}</b>`);
  if (v === 'full' || v === 'career') { col('regPpg', 'Reg PPG', r => r.regPpg, x => fmt(x)); col('poPpg', 'Playoff PPG', r => r.poPpg, x => fmt(x)); }
  col('best', 'Best', r => r.best, x => fmtScore(x));
  col('total', 'Total', r => r.total, x => fmt(x));
  if (v !== 'po') { col('mvp', '👑 MVP', r => r.mvp); col('aow', '🍑 AOW', r => r.aow); }
  if (v === 'career') col('titles', '💍 Rings', r => r.titles, x => x ? (x <= 3 ? '💍'.repeat(x) : '💍x' + x) : '—');

  let extra = [];
  if (v === 'reg') extra = gameWeeks(s).map(w => ({ label: w.label.replace('Week ', 'W'), k: 'reg:' + w.idx }));
  if (v === 'po') extra = s.playoffs.map(r => ({ label: r.label, k: 'po:' + r.key }));
  if (v === 'career') extra = [...SEASONS].reverse().map(ss => ({ label: ss.label.replace('Season ', 'S') + ' PPG', season: ss.id }));

  const sc = C.find(c => c.key === ui.sort.key) || C.find(c => c.key === 'ppg');
  const dir = ui.sort.dir;
  if (ui.sort.key === 'name' || ui.sort.key === 'team') rows.sort((a, b) => dir * String(a[ui.sort.key]).localeCompare(String(b[ui.sort.key])));
  else rows.sort((a, b) => { const x = sc.get(a), y = sc.get(b); if (x == null) return 1; if (y == null) return -1; return dir * (x - y) || (b.ppg - a.ppg); });

  const seg = `<div class="seg">${VIEWS.map(([k, l]) => `<button class="${v === k ? 'on' : ''}" data-act="view" data-v="${k}">${l}</button>`).join('')}</div>
    <label class="sub" style="margin-left:12px">Min games <select data-act-change="mingp" style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-family:inherit">${[1, 2, 3, 5, 8].map(n => `<option value="${n}" ${ui.minGp === n ? 'selected' : ''}>${n === 1 ? 'Any' : n + '+'}</option>`).join('')}</select></label>
    <p class="view-desc">${VIEWS.find(x => x[0] === v)[2]}${hidden ? ` ${hidden} player${hidden > 1 ? 's' : ''} under ${ui.minGp} games hidden.` : ''}${v !== 'po' ? ' 👑/🍑 count weekly MVP and Ass of the Week awards (regular season).' : ''} Click a column to sort.</p>`;
  if (!rows.length) return seg + `<div class="empty-state"><div class="big-icon">🎯</div><h3>No ${v === 'po' ? 'playoff ' : ''}player data yet</h3><p>${s.editable ? 'Upload game CSVs on the Week Results tab.' : 'Nothing recorded for this view.'}</p></div>`;

  const th = (key, label, cls = 'r') => `<th class="${cls} sortable ${ui.sort.key === key ? 'sorted' : ''}" data-act="sort" data-v="${key}">${label}${ui.sort.key === key ? (dir < 0 ? ' ▾' : ' ▴') : ''}</th>`;
  const head = `<th>#</th>${th('name', 'Player', '')}${th('team', v === 'career' ? 'Current Team' : 'Team', '')}${C.map(c => th(c.key, c.label, c.cls)).join('')}${extra.map(e => `<th class="wk">${esc(e.label)}</th>`).join('')}`;
  const rc = ['gold', 'silver', 'bronze'];
  const body = rows.map((r, i) => {
    const ex = extra.map(e => {
      const val = e.season ? r.seasonPpg[e.season] : r.byKey[e.k];
      if (val == null) return '<td class="wk blank">—</td>';
      const best = !e.season && val === r.best && r.gp > 1;
      return `<td class="wk ${best ? 'best' : ''}">${e.season ? fmt(val) : fmtScore(val)}</td>`;
    }).join('');
    return `<tr><td><span class="rank-num ${rc[i] || ''}">${i + 1}</span></td><td style="font-weight:700">${esc(r.name)}</td><td style="color:var(--muted)">${esc(r.team)}</td>
      ${C.map(c => `<td class="${c.cls}">${c.f(c.get(r))}</td>`).join('')}${ex}</tr>`;
  }).join('');
  return seg + `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function drawCharts(m) {

  const st = standings(m), labels = st.map(r => m.name(r.id));

  mk('c-ppg', { type: 'bar', data: { labels: ps.map(p => p.name), datasets: [{ label: 'PPG', data: ps.map(p => +p.ppg.toFixed(2)), backgroundColor: ps.map((_, i) => COLORS[i % 12]), borderRadius: 4 }] }, options: base({ indexAxis: 'y', plugins: { legend: { display: false } } }) });
  const tally = awardTally(m.s), names = {};

  const aw = Object.entries(tally).map(([k, c]) => ({ name: names[k] || k, ...c })).sort((a, b) => (b.mvp + b.aow) - (a.mvp + a.aow) || b.mvp - a.mvp).slice(0, 12);
  mk('c-aw', { type: 'bar', data: { labels: aw.map(a => a.name), datasets: [{ label: '👑 MVP', data: aw.map(a => a.mvp), backgroundColor: '#ffcc00', borderRadius: 4 }, { label: '🍑 Ass of the Week', data: aw.map(a => a.aow), backgroundColor: '#ff4444', borderRadius: 4 }] }, options: base({ indexAxis: 'y', scales: { x: { ticks: { ...tick, stepSize: 1, precision: 0 }, grid }, y: { ticks: tick, grid: { display: false } } } }) });
  const wks = gameWeeks(m.s).filter(w => m.reg.some(g => g.key === w.idx));
  mk('c-trend', { type: 'line', data: { labels: wks.map(w => w.label), datasets: m.teams.map((t, i) => ({ label: t.name, data: wks.map(w => { const g = m.reg.find(g => g.key === w.idx && (g.a.id === t.id || g.b.id === t.id)); return g ? (g.a.id === t.id ? g.a.total : g.b.total) : null; }), borderColor: COLORS[i % 12], backgroundColor: 'transparent', tension: 0.3, spanGaps: false, pointRadius: 4 })) }, options: base({ plugins: { legend: { labels: { color: '#fff', boxWidth: 12, font: { size: 11 } } } } }) });
}

/* ============================== UPLOADS ============================== */
const pendingQueue = [];
function listFor(st, target) {
  const [kind, key] = target.split(':');
  if (kind === 'w') return (st.weeks[key] = st.weeks[key] || []);
  return (st.playoffs[key] = st.playoffs[key] || []);
}
async function handleFiles(files, target) {
  const s = cur(), st = seasonStore(s);
  const items = await Promise.all([...files].map(f => f.text().then(t => ({ file: f.name, text: t.replace(/^﻿/, '').replace(/\r/g, '').trim() }))));
  let added = 0, dup = 0; const bad = [], warns = [];
  for (const it of items) {
    const list = listFor(st, target);
    const allTexts = [...Object.values(st.weeks).flat(), ...Object.values(st.playoffs).flat()];
    if (allTexts.includes(it.text)) { dup++; continue; }
    const blocks = parseCSV(it.text);
    if (!blocks) { bad.push(it.file); continue; }
    const ids = resolveBlocks(teamsFor(s), blocks, st.assign[hash(it.text)]);
    if (ids[0] && ids[1]) { list.push(it.text); added++; const w = checkGame(s, target, ids); if (w) warns.push(w); }
    else pendingQueue.push({ ...it, blocks, ids, target });
  }
  saveStore(); invalidate(s.id); render();
  const parts = [];
  if (added) parts.push(`${added} game${added > 1 ? 's' : ''} added`);
  if (dup) parts.push(`${dup} duplicate${dup > 1 ? 's' : ''} skipped`);
  if (bad.length) parts.push(`couldn't read ${bad.join(', ')}`);
  if (warns.length) parts.push(warns.join(' '));
  if (parts.length) toast(parts.join(' · '), bad.length || warns.length);
  nextPending();
}
function checkGame(s, target, ids) {
  const [kind, key] = target.split(':');
  if (kind !== 'w') return null;
  const w = s.schedule[+key], m = model(s);
  const on = w.matches.some(([a, b]) => (a === ids[0] && b === ids[1]) || (a === ids[1] && b === ids[0]));
  return on ? null : `${m.name(ids[0])} vs ${m.name(ids[1])} isn't on the ${w.label} schedule — loaded anyway, double-check the week.`;
}
function nextPending() {
  if (!pendingQueue.length) return;
  const p = pendingQueue[0], s = cur(), teams = teamsFor(s);
  const opts = sel => `<option value="">— Pick a team —</option>` + teams.map(t => `<option value="${t.id}" ${sel === t.id ? 'selected' : ''}>${esc(t.name)} (${esc(t.captain)})</option>`).join('');
  openModal(`<h3>Which teams played?</h3><p>Couldn't confidently match <strong>${esc(p.file)}</strong>. Pick the team for each side — new team names get remembered so this file type won't ask again.</p>
    ${p.blocks.map((b, i) => `<div class="blockbox"><div class="raw">"${esc(b.rawName)}" — ${fmtScore(b.total)} pts</div><div class="pl">${b.players.length ? b.players.map(x => esc(x.name)).join(', ') : 'No player rows'}</div>
      <label class="fl" for="as-${i}">Team</label><select id="as-${i}">${opts(p.ids[i])}</select></div>`).join('')}
    <div class="actions"><button class="btn ghost" data-act="skip-pending">Skip file</button><button class="btn primary" data-act="save-pending">Save game</button></div>`, 'pending');
}
function savePending() {
  const p = pendingQueue[0], s = cur(), st = seasonStore(s), teams = teamsFor(s);
  const a = document.getElementById('as-0').value, b = document.getElementById('as-1').value;
  if (!a || !b) { toast('Pick a team for both sides', true); return; }
  if (a === b) { toast('Both sides can\'t be the same team', true); return; }
  st.assign[hash(p.text)] = { 0: a, 1: b };
  [a, b].forEach((id, i) => {
    if (p.ids[i] === id) return;
    const raw = p.blocks[i].rawName, k = norm(raw);
    if (k && !teams.some(t => t.nameKeys.has(k))) (st.aliases[id] = st.aliases[id] || []).push(raw);
  });
  listFor(st, p.target).push(p.text);
  const w = checkGame(s, p.target, [a, b]);
  pendingQueue.shift(); saveStore(); invalidate(s.id); closeModal(true); render();
  toast('Game added' + (w ? ' · ' + w : ''), !!w);
  nextPending();
}

/* ============================== DATA ============================== */
function doBackup() {
  const blob = new Blob([JSON.stringify({ app: 'sae-trivia-dashboard', version: 5, exported: new Date().toISOString(), store }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sae_trivia_backup_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup downloaded');
}
async function doRestore(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== 'sae-trivia-dashboard' || typeof data.store !== 'object') throw new Error('bad');
    if (!confirm('Replace everything saved in this browser with this backup?')) return;
    store = data.store; saveStore(); invalidate(); ui.week = null; render();
    toast('Backup restored');
  } catch (e) { toast('That file isn\'t a dashboard backup', true); }
}
function doClear() {
  const s = cur();
  if (!confirm(`Clear all ${s.label} scores from this browser? Team names are kept.`)) return;
  const st = seasonStore(s); st.weeks = {}; st.playoffs = {}; st.assign = {};
  saveStore(); invalidate(s.id); ui.week = null; render(); toast('Scores cleared');
}
function removeGame(h, phase, key) {
  const s = cur(), st = seasonStore(s);
  if (!confirm('Remove this game? You can re-upload the CSV any time.')) return;
  const list = phase === 'reg' ? st.weeks[key] : st.playoffs[key];
  const i = (list || []).findIndex(t => hash(t.trim()) === h);
  if (i >= 0) list.splice(i, 1);
  delete st.assign[h];
  saveStore(); invalidate(s.id); render(); toast('Game removed');
}

/* ============================== THE RAFTERS ============================== */
const NUM_WORDS = ['ZERO', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE', 'TEN', 'ELEVEN', 'TWELVE'];
const ROUND_PHRASE = { playin: 'play-in round', wildcard: 'wild card round', semis: 'semifinal round', championship: 'championship' };
const pts = n => { const s = fmtScore(n); return s.startsWith('0.') ? s.slice(1) : s; };
const nick = n => RAFTERS_NICKNAMES[n] || n.split(' ')[0];
const joinNames = a => a.length > 2 ? a.slice(0, -1).join(', ') + ' & ' + a[a.length - 1] : a.join(' & ');
const whenLabel = (s, phase, key) => phase === 'reg' ? s.schedule[key].label.toLowerCase() : ROUND_PHRASE[key];

// Builds the season awards post. Returns { lines: [{label, value, note}], header, final }.
function rafterAwards(s) {
  const m = model(s), b = bracket(m), st = standings(m), ov = s.rafterOverrides || {};
  const rosterNames = new Set(s.teams.flatMap(t => t.players.map(norm)));
  const recs = performances(s);
  const isSub = r => !m.byId[r.team] || !m.byId[r.team].playerSet.has(norm(r.name));
  const out = [];
  const add = (label, value, note) => { if (value) out.push({ label, value, note }); };

  // Champions
  if (b.champion) { const t = m.byId[b.champion]; add('Champions', `${t.name} (${t.players.map(nick).join(', ')})`); }
  else add('Champions', 'TBD', 'Decided Championship week');

  // MVP / Ass of the Year — regular season PPG, roster players with at least half the max games played
  const reg = aggregate(recs.filter(r => r.phase === 'reg')).filter(p => rosterNames.has(p.key));
  const maxGp = Math.max(0, ...reg.map(p => p.gp));
  const elig = reg.filter(p => p.gp >= Math.ceil(maxGp / 2));
  const extreme = (list, field, dir) => { if (!list.length) return null; const v = dir > 0 ? Math.max(...list.map(p => p[field])) : Math.min(...list.map(p => p[field])); const r2 = x => Math.round(x * 100); return { v, names: list.filter(p => r2(p[field]) === r2(v)).map(p => p.name).sort() }; };
  const mvp = extreme(elig, 'ppg', 1), aoty = extreme(elig, 'ppg', -1);
  if (mvp) add('MVP', `${joinNames(mvp.names)} (${fmt(mvp.v)} PPG)`, `Highest regular-season PPG (min ${Math.ceil(maxGp / 2)} games)`);
  if (aoty) add('Ass of the Year', `${joinNames(aoty.names)} (${fmt(aoty.v)} PPG)`, `Lowest regular-season PPG (min ${Math.ceil(maxGp / 2)} games)`);

  // Playoff MVP — highest playoff PPG, min 2 playoff games (or the max anyone played, if lower)
  const po = aggregate(recs.filter(r => r.phase === 'po' && !isSub(r)));
  if (po.length) {
    const minPo = Math.min(2, Math.max(...po.map(p => p.gp)));
    const pm = extreme(po.filter(p => p.gp >= minPo), 'ppg', 1);
    if (pm) add('Playoff MVP', `${joinNames(pm.names)} (${fmt(pm.v)} PPG)`, `Highest playoff PPG (min ${minPo} games)`);
  }

  // Commissioner's Cup — best regular season (the 1 seed)
  if (m.reg.length) { const c = st[0]; add("Commissioner's Cup", `${m.name(c.id)} (${c.w}-${c.l}${c.t ? '-' + c.t : ''}, ${fmtScore(c.pf)} PF)`, b.final ? 'Best regular season (1 seed)' : 'Current 1 seed'); }

  // Lights Were Too Bright — lowest single playoff score
  const poRecs = recs.filter(r => r.phase === 'po' && !isSub(r));
  if (ov.lightsTooBright) { add('"The Lights Were Too Bright" Award', ov.lightsTooBright, 'From the original post'); out[out.length - 1].suffix = ' for worst playoff performance'; }
  else if (poRecs.length) {
    const lo = Math.min(...poRecs.map(r => r.score)), who = poRecs.filter(r => r.score === lo);
    add('"The Lights Were Too Bright" Award', `${joinNames([...new Set(who.map(r => r.name))])} (${pts(lo)} pts, ${whenLabel(s, 'po', who[0].key)})`, 'Worst single playoff game', 'for worst playoff performance');
    out[out.length - 1].suffix = ' for worst playoff performance';
  }

  // Single game highs
  const sides = [...m.reg, ...Object.values(m.po).flat()].flatMap(g => [g.a, g.b].map(x => ({ ...x, phase: g.phase, key: g.key })));
  if (sides.length) {
    const hi = Math.max(...sides.map(x => x.total)), w = sides.filter(x => x.total === hi);
    add('Single game high (team)', `${joinNames([...new Set(w.map(x => m.name(x.id)))])} (${pts(hi)} points, ${whenLabel(s, w[0].phase, w[0].key)})`);
  }
  const allRecs = recs.filter(r => !isSub(r));
  if (allRecs.length) {
    const hi = Math.max(...allRecs.map(r => r.score)), w = allRecs.filter(r => r.score === hi);
    add('Single game high (player)', `${joinNames([...new Set(w.map(r => r.name))])} (${pts(hi)} points, ${whenLabel(s, w[0].phase, w[0].key)})`);
  }
  return { header: `SAETL SEASON ${NUM_WORDS[s.num] || s.num}: ${s.postDates || s.dates}`, lines: out, final: !!b.champion };
}
function rafterText(s) {
  if (s.rafterPost) return s.rafterPost;
  const r = rafterAwards(s);
  return `__**${r.header}**__\n` + r.lines.map(l => `**${l.label}**${l.suffix || ''}: ${l.value}`).join('\n\n');
}
// Minimal Discord-markdown preview: __**x**__ = bold underline, **x** = bold.
function discordHtml(text) {
  return esc(text).replace(/__\*\*(.+?)\*\*__/g, '<u><b>$1</b></u>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
}
function postCard(id, title, sub, text, notes) {
  return `<div class="rafter-card">
    <div class="rafter-head"><div><div class="nm">${esc(title)}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
      <div class="rafter-btns"><button class="btn ghost" data-act="tweak-post" data-v="${id}">✏️ Tweak</button><button class="btn primary" data-act="copy-post" data-v="${id}">📋 Copy for Discord</button></div></div>
    <div class="discord"><div class="discord-name">Commish</div><div class="discord-body">${discordHtml(text)}</div></div>
    <textarea id="ta-${id}" class="rafter-ta" style="display:none" spellcheck="false">${esc(text)}</textarea>
    ${notes ? `<div class="rafter-notes">${notes}</div>` : ''}
  </div>`;
}
function renderRafters(m) {
  const s = m.s, r = rafterAwards(s);
  const notes = s.rafterPost ? '' : r.lines.filter(l => l.note).map(l => `<span><b>${esc(l.label.replace(/"/g, ''))}</b> — ${esc(l.note)}</span>`).join('');
  const others = SEASONS.filter(x => x.id !== s.id).map(x => postCard(x.id, x.label, x.rafterPost ? 'Original post' : x.editable ? 'In progress' : 'Final', rafterText(x))).join('');
  return `<div class="note">🏛️ Your season awards post, built straight from the data and formatted for Discord. Hit <strong>Copy for Discord</strong> and paste it into #the-rafters. Use <strong>Tweak</strong> to edit the text before copying (edits aren't saved).${r.final ? '' : ' <strong>The season is still in progress</strong>, so this shows the race so far.'}</div>`
    + postCard(s.id, s.label, s.rafterPost ? 'Original post' : r.final ? 'Final' : 'Race so far — updates as games come in', rafterText(s), notes)
    + (others ? `<div class="section-title" style="margin-top:32px">From the Rafters</div>${others}` : '');
}
async function copyPost(id) {
  const ta = document.getElementById('ta-' + id);
  const text = ta.value;
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const wasHidden = ta.style.display === 'none';
    ta.style.display = 'block'; ta.select(); document.execCommand('copy');
    if (wasHidden) ta.style.display = 'none';
  }
  toast('Copied — paste it into Discord');
}

/* ============================== EVENTS ============================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (e.target.id === 'modal-bg') closeModal(); return; }
  const v = el.dataset.v;
  switch (el.dataset.act) {
    case 'tab': ui.tab = v; render(); break;
    case 'week': ui.week = v; render(); break;
    case 'view': ui.statView = v; ui.sort = { key: 'ppg', dir: -1 }; render(); break;
    case 'sort': ui.sort = ui.sort.key === v ? { key: v, dir: -ui.sort.dir } : { key: v, dir: (v === 'name' || v === 'team') ? 1 : -1 }; render(); break;
    case 'seasons': ui.screen = 'seasons'; render(); window.scrollTo(0, 0); break;
    case 'open-season': ui.screen = 'dash'; if (ui.season !== v) { ui.season = v; ui.week = null; } render(); window.scrollTo(0, 0); break;
    case 'rename': openRename(v); break;
    case 'rename-save': saveRename(v); break;
    case 'close': closeModal(); break;
    case 'save-pending': savePending(); break;
    case 'skip-pending': pendingQueue.shift(); closeModal(true); toast('File skipped'); nextPending(); break;
    case 'remove': removeGame(el.dataset.h, el.dataset.phase, el.dataset.key); break;
    case 'backup': doBackup(); break;
    case 'restore': document.getElementById('restore-input').click(); break;
    case 'clear': doClear(); break;
    case 'copy-post': copyPost(v); break;
    case 'tweak-post': { const ta = document.getElementById('ta-' + v); ta.style.display = ta.style.display === 'none' ? 'block' : 'none'; break; }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.up && t.files.length) { handleFiles(t.files, t.dataset.up); }
  if (t.dataset && t.dataset.actChange === 'mingp') { ui.minGp = +t.value; render(); }
  if (t.id === 'restore-input' && t.files.length) { doRestore(t.files[0]); t.value = ''; }
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('modal-bg').classList.contains('show')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'rn-input') document.querySelector('[data-act="rename-save"]').click();
});

render();
</script>
